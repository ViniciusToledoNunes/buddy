[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-meeting-copilot"
version = "0.3.0"
description = "Buddy - a cross-platform, project-aware meeting copilot"
requires-python = ">=3.12,<3.15"
dependencies = [
  "faster-whisper>=1.2.1,<2",
  "httpx>=0.28,<1",
  "mcp>=2.1,<3",
  "numpy>=2.2,<3",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pynput>=1.8,<2",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6,<7",
  "rich>=14,<16",
  "soundcard>=0.4.5,<0.5",
  "typer>=0.16,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
buddy = "meeting_agent.cli:app"
buddy-mcp = "meeting_agent.mcp_server:main"
meeting-agent = "meeting_agent.cli:app"
meeting-agent-mcp = "meeting_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
