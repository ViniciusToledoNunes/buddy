[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-meeting-copilot"
version = "0.3.0"
description = "Buddy - a cross-platform, project-aware meeting copilot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
keywords = ["meetings", "transcription", "copilot", "speech-to-text", "claude-code", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Office/Business",
]
dependencies = [
  "anthropic>=1,<2",
  "faster-whisper>=1.2.1,<2",
  "httpx>=0.28,<1",
  "mcp>=2.1,<3",
  "numpy>=2.2,<3",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pynput>=1.8,<2",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6,<7",
  "rich>=14,<16",
  "soundcard>=0.4.5,<0.5",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/ViniciusToledoNunes/buddy"
Issues = "https://github.com/ViniciusToledoNunes/buddy/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8"]

[project.scripts]
buddy = "meeting_agent.cli:app"
buddy-mcp = "meeting_agent.mcp_server:main"
meeting-agent = "meeting_agent.cli:app"
meeting-agent-mcp = "meeting_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["meeting_agent"]
# Omitted modules need real audio hardware, a display server, a downloaded Whisper
# model, or a live host to execute. They are verified by `buddy doctor` and by the
# manual platform checklist in docs/PORTABILITY.md, not by the automated gate.
omit = [
  "*/meeting_agent/asr/cloud.py",
  "*/meeting_agent/asr/local.py",
  "*/meeting_agent/benchmark.py",
  "*/meeting_agent/capture/*",
  "*/meeting_agent/cli.py",
  "*/meeting_agent/doctor.py",
  "*/meeting_agent/session.py",
  "*/meeting_agent/system.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
