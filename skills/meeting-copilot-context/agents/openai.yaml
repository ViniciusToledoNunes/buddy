interface:
  display_name: "Buddy Meeting Context"
  short_description: "Connect Buddy meetings to project evidence"
  default_prompt: "Use $meeting-copilot-context to relate this Buddy meeting to the current project."

dependencies:
  tools:
    - type: "mcp"
      value: "buddy"
      description: "Bounded access to live and saved Buddy meeting context"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
