language: en                 # en, pt, or auto
asr_mode: auto               # auto, local-gpu, local-cpu (always local)
llm_provider: auto           # auto, openai, anthropic, ollama, disabled
save_audio: false
meetings_dir: meetings
# Extra env files to source, for credentials a wrapper script loads per command and
# never exports. Paths may use ~.
env_files: []

audio:
  sample_rate: 24000
  chunk_ms: 100
  system_device: default     # WASAPI output, PipeWire sink, or macOS system audio
  microphone_device: default
  queue_seconds: 12
  # A stream carrying only digital silence for this long is treated as lost and the
  # device is re-resolved. This is what recovers capture when a headset takes the
  # jack and Windows leaves the old endpoint valid but mute. 0 disables the check.
  silence_reconnect_seconds: 20

asr:
  local_model_en: tiny.en
  local_model_multilingual: base
  compute_type: int8
  beam_size: 1
  vad_threshold: 0.012
  min_speech_ms: 250
  silence_ms: 600
  max_segment_seconds: 12

copilot:
  enabled: true
  automatic_suggestions: true
  # Buddy re-evaluates the whole suggestion set whenever new speech arrives.
  # debounce: quiet time after the last final utterance before analysing.
  # refresh: minimum gap between two analyses, so a fast talker cannot flood the provider.
  suggestion_debounce_seconds: 1.5
  suggestion_refresh_seconds: 6.0
  # A reasoning model with a full meeting prompt regularly needs more than 25s.
  request_timeout_seconds: 45
  context_minutes: 5
  # Cross-meeting recall over structured memory only; raw transcripts are never indexed.
  semantic_memory_enabled: true
  semantic_memory_max_meetings: 50
  semantic_memory_matches: 3
  output_language: en
  # Tier 1 refreshes the panel every few seconds, so it runs the fastest model.
  # Runs today: the OpenAI account already has credit.
  openai_model: gpt-5.4-mini
  # gpt-5 models reason by default; on a full meeting prompt that costs tens of
  # seconds. none | low | medium | high | xhigh
  openai_reasoning_effort: none
  # Ready for a switch of llm_provider once Anthropic credit exists.
  anthropic_model: claude-haiku-4-5
  # Ranked project excerpts are added to the cached prompt prefix. Turn this off to
  # keep source code entirely out of the requests.
  project_context_enabled: true
  project_context_matches: 3
  # Every prior meeting's structured memory goes in the cached prefix.
  prior_meetings_in_context: 20
  # The investigator runs a tool loop in the background when the panel raises a
  # question it could not answer. Answers land in their own panel, 30-60s later.
  investigation_enabled: true
  investigation_model: gpt-5.4
  investigation_reasoning_effort: low
  investigation_max_turns: 8
  investigation_timeout_seconds: 180
  investigations_in_flight: 1
  # Conectores externos. Somente leitura; uma query que varreria mais que o limite
  # e recusada no dry run gratuito, antes de ser cobrada.
  bigquery_enabled: true
  # Pays for the query; empty falls back to GOOGLE_CLOUD_PROJECT.
  bigquery_billing_project: ''
  # Where the data actually lives. Tables are addressed fully qualified.
  bigquery_data_projects: []
  bigquery_max_scan_gb: 20
  jira_enabled: true          # ativa sozinho quando JIRA_* existir no .env
  datadog_enabled: true       # activates when DD_SITE, DD_API_KEY and DD_APP_KEY exist
  ollama_model: qwen3:4b

hotkeys:
  toggle_meeting: ctrl+alt+m
  suggest_now: ctrl+alt+space

ui:
  refresh_hz: 8
  overlay: false

benchmark:
  source: C:\Users\vinic\Videos\trr01.mp4
  seconds: 60
  models: [tiny.en, base.en, distil-small.en]
